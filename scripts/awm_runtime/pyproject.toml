[project]
name = "aias-audit-world-model"
version = "0.7.0"
description = "AIAS Audit World Model autonomous audit planning and next-best-action policy"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "networkx>=3.2,<4",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
